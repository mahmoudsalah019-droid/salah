<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahmoud & Lamiaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Great+Vibes&family=Italiana&family=Reem+Kufi:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efe9e1; --ink:#2a2622; --muted:#7a7068;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:"Cormorant Garamond",serif;padding:48px 16px 80px}
header{text-align:center;margin-bottom:40px}
header h1{font-family:"Cinzel",serif;font-weight:400;letter-spacing:.3em;font-size:clamp(18px,3vw,26px)}
header p{font-family:"Amiri",serif;color:var(--muted);margin-top:8px;font-size:18px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px 40px;max-width:1040px;margin:0 auto}
figure{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font-family:"Cinzel",serif;letter-spacing:.25em;font-size:13px;color:var(--muted)}
figcaption span{display:block;font-family:"Amiri",serif;letter-spacing:0;font-size:16px;text-align:center}

/* ===== shared card ===== */
.card{position:relative;width:100%;max-width:500px;aspect-ratio:5/7;container-type:inline-size;overflow:hidden;
  box-shadow:0 2px 4px rgba(0,0,0,.08),0 18px 40px -12px rgba(60,40,20,.35)}
.card svg.layer{position:absolute;inset:0;width:100%;height:100%}
.ltr{direction:ltr}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center}

/* ===== 1. SAKURA INK ===== */
.sakura{background:#f6f0e4}
.sakura .center{padding-top:42cqw}
.sakura .kicker{font-family:"Cinzel",serif;font-size:2.6cqw;letter-spacing:.55em;color:#3b3530;margin-inline-start:.55em}
.sakura .rule{width:10cqw;height:1px;background:#3b3530;opacity:.55;margin:4.2cqw 0}
.sakura .name{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:9.4cqw;letter-spacing:.14em;line-height:1;color:#1f1b18;margin-inline-start:.14em}
.sakura .amp{font-family:"Great Vibes",cursive;font-size:10cqw;color:#a3201c;line-height:1;margin:1.4cqw 0 .6cqw}
.sakura .ar{font-family:"Amiri",serif;font-size:4.6cqw;color:#a3201c;margin-top:3.2cqw;direction:rtl}
.sakura .date{font-family:"Cinzel",serif;font-size:2.9cqw;letter-spacing:.32em;line-height:2;color:#2a2622;margin-inline-start:.32em}
.sakura .venue{font-family:"Cinzel",serif;font-size:3.1cqw;letter-spacing:.3em;line-height:1.9;color:#2a2622;margin-inline-start:.3em}
.sakura .venue small{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;letter-spacing:.12em;font-size:3cqw;color:#6c625a}

/* ===== 2. EMERALD ARABESQUE ===== */
.emerald{background:radial-gradient(120% 90% at 50% 40%,#0f5a48 0%,#0a3e33 55%,#062a23 100%)}
.gold{background:linear-gradient(170deg,#f6e3a8 0%,#d4ad5b 35%,#a67c2e 60%,#f1d999 85%,#b8913f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.emerald .center{padding-top:30cqw}
.emerald .bism{font-family:"Amiri",serif;font-size:3.6cqw;color:#e6cf8f;opacity:.9}
.emerald .invite{font-family:"Amiri",serif;font-size:3.4cqw;color:#e9e2cf;line-height:1.8;margin-top:3cqw;max-width:62cqw}
.emerald .names-ar{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:15cqw;line-height:1.25;margin-top:3cqw}
.emerald .names-en{font-family:"Cinzel",serif;font-size:3.2cqw;letter-spacing:.45em;color:#e6cf8f;margin-top:.5cqw;margin-inline-start:.45em}
.emerald .orn{width:34cqw;margin:4.5cqw 0 3.5cqw}
.emerald .row{display:flex;gap:5cqw;align-items:center;font-family:"Amiri",serif;color:#f1ead6}
.emerald .row .big{font-family:"Cinzel",serif;font-size:9cqw;line-height:1}
.emerald .row .side{font-size:3.4cqw;line-height:1.5;padding:1cqw 0;border-top:1px solid rgba(214,180,100,.6);border-bottom:1px solid rgba(214,180,100,.6);min-width:22cqw}
.emerald .venue{font-family:"Amiri",serif;font-size:4.4cqw;color:#f1ead6;margin-top:6cqw}
.emerald .venue-en{font-family:"Cinzel",serif;font-size:2.4cqw;letter-spacing:.4em;color:#cdb47a;margin-top:1.2cqw}

/* ===== 3. MIDNIGHT ARCH ===== */
.midnight{background:linear-gradient(180deg,#0e1730 0%,#17244a 55%,#1d2b55 100%)}
.midnight .center{padding-top:53cqw}
.midnight .kicker{font-family:"Italiana",serif;font-size:2.3cqw;letter-spacing:.4em;color:#cdb98a;margin-inline-start:.5em}
.midnight .name{font-family:"Great Vibes",cursive;font-size:12cqw;line-height:1.05;color:#f3e7c6}
.midnight .and{font-family:"Italiana",serif;font-size:4cqw;color:#cdb98a;letter-spacing:.3em;margin:-.5cqw 0 -.5cqw}
.midnight .ar{font-family:"Reem Kufi",sans-serif;font-size:3.6cqw;color:#cdb98a;margin-top:1.6cqw;letter-spacing:.05em}
.midnight .line{width:52cqw;height:1px;background:linear-gradient(90deg,transparent,#cdb98a,transparent);margin:3.2cqw 0}
.midnight .date{display:flex;align-items:center;gap:3.5cqw;font-family:"Italiana",serif;color:#f3e7c6}
.midnight .date .d{font-size:10cqw;line-height:1}
.midnight .date .m{font-size:2.8cqw;letter-spacing:.35em;line-height:1.9;text-align:left}
.midnight .venue{font-family:"Italiana",serif;font-size:3.6cqw;letter-spacing:.35em;color:#f3e7c6;margin-inline-start:.35em}
.midnight .venue small{display:block;font-size:2.5cqw;letter-spacing:.45em;color:#9fa9c8;margin-top:1.3cqw}

/* ===== 4. TERRACOTTA OLIVE ===== */
.terra{background:#efe3d3}
.terra .center{padding-top:30cqw}
.terra .kicker{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:4cqw;color:#f6ead9}
.terra .name{font-family:"Italiana",serif;font-size:11.5cqw;letter-spacing:.06em;line-height:1.05;color:#fff6ea}
.terra .amp{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:8cqw;color:#f2cfa5;line-height:1}
.terra .ar{font-family:"Aref Ruqaa",serif;font-size:5.2cqw;color:#f6ead9;margin-top:2cqw}
.terra .sep{width:8cqw;height:1px;background:#f6ead9;opacity:.7;margin:4.5cqw 0}
.terra .date{font-family:"Cinzel",serif;font-size:3cqw;letter-spacing:.3em;line-height:2;color:#fff6ea;margin-inline-start:.3em}
.terra .venue{position:absolute;bottom:13cqw;left:0;right:0;font-family:"Cinzel",serif;font-size:3.4cqw;letter-spacing:.35em;color:#7b3a22;margin-inline-start:.35em}
.terra .venue small{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;letter-spacing:.1em;font-size:3.2cqw;color:#8a6a55;margin-top:.6cqw}
</style>
</head>
<body>
<header>
  <h1>MAHMOUD &amp; LAMIAA</h1>
  <p>أربعة أساليب لدعوة الفرح — قاعة لوسيندا</p>
</header>

<main class="gallery">

<!-- ================= 1. SAKURA INK ================= -->
<figure>
<div class="card sakura" id="card-sakura">
  <svg class="layer" viewBox="0 0 500 700" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="paper" x="0" y="0" width="100%" height="100%">

      <g id="blossom">

        </g>
        <circle r="2.4" fill="#e7b3ad"/>
        <g stroke="#a3201c" stroke-width=".7"><path d="M0 0L0 -4M0 0L3.6 -1.3M0 0L2.3 3.2M0 0L-2.3 3.2M0 0L-3.6 -1.3"/></g>
        <g fill="#a3201c"><circle cy="-4" r=".8"/><circle cx="3.6" cy="-1.3" r=".8"/><circle cx="2.3" cy="3.2" r=".8"/><circle cx="-2.3" cy="3.2" r=".8"/><circle cx="-3.6" cy="-1.3" r=".8"/></g>
      </g>

    <path d="M0 640 C50 618 90 610 130 624 C170 638 210 612 260 622 C310 632 350 655 400 650 C440 646 470 636 500 640 V700 H0Z" fill="url(#mtn2)" filter="url(#blur3)" opacity=".8"/>
    <g transform="translate(500 0) scale(.8) translate(-500 -40)">
    <!-- branch -->
    <g filter="url(#rough)" fill="none" stroke="#2b2622" stroke-linecap="round">
      <path d="M512 330 C470 300 455 260 420 228 C392 202 360 186 318 176 C290 170 262 164 238 150" stroke-width="5"/>
      <path d="M420 228 C430 196 446 170 470 150" stroke-width="3"/>
      <path d="M362 190 C352 166 340 148 318 132" stroke-width="2.4"/>
      <path d="M458 280 C430 290 410 300 392 322" stroke-width="2.6"/>
      <path d="M290 168 C276 180 266 192 252 198" stroke-width="1.8"/>
    </g>
    <!-- leaves -->
    <g fill="#3f3934" opacity=".85">
      <path d="M238 150 q-24 -6 -40 6 q22 4 40 -6z"/>
      <path d="M470 150 q8 -22 26 -28 q-6 22 -26 28z"/>

    <use href="#blossom" transform="translate(304 172) scale(1.5) rotate(10)"/>
    <use href="#blossom" transform="translate(362 186) scale(1.25) rotate(-20)"/>
    <use href="#blossom" transform="translate(422 222) scale(1.6) rotate(30)"/>
    <use href="#blossom" transform="translate(452 168) scale(1.1)"/>

    <use href="#bud" transform="translate(442 264) rotate(40)"/>
    </g>
    <!-- falling petals -->
    <g fill="#f2d6d0" stroke="#b8908a" stroke-width=".5">
      <ellipse cx="270" cy="270" rx="3" ry="5" transform="rotate(40 270 270)"/>
      <ellipse cx="420" cy="420" rx="2.6" ry="4.4" transform="rotate(-30 420 420)"/>
      <ellipse cx="455" cy="520" rx="3" ry="5" transform="rotate(70 455 520)"/>

    <path d="M64 0 V700" stroke="#a3201c" stroke-width="2.6"/>

    <g fill="none" stroke="#a3201c" stroke-width="2.4" stroke-linecap="round">
      <path d="M64 372 C40 350 22 340 26 356 C30 372 52 374 64 372"/>
      <path d="M64 372 C78 344 98 336 98 352 C98 366 78 372 64 372"/>
      <path d="M64 372 C56 398 40 420 28 436"/>

    <div class="amp">&amp;</div>
    <div class="name">LAMIAA</div>
    <div class="ar">محمود و لمياء</div>
    <div class="rule"></div>
    <div class="date">SATURDAY<br>12 · DECEMBER · 2026</div>
    <div class="rule"></div>

  </div>
</div>
<figcaption>SAKURA INK<span>الحبر الياباني — نسخة مطوّرة من التصميم الأصلي</span></figcaption>
</figure>

<!-- ================= 2. EMERALD ARABESQUE ================= -->

<!-- ================= 3. MIDNIGHT ARCH ================= -->
<figure>
<div class="card midnight" id="card-midnight">
  <svg class="layer" viewBox="0 0 500 700" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e2b0"/><stop offset=".5" stop-color="#c9a764"/><stop offset="1" stop-color="#f0dca6"/></linearGradient>
